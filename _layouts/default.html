<!doctype html>
<html lang="{{ page.lang | default: 'ja' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.full_title %}{{ page.full_title }}{% else %}{{ page.title }} | {{ page.site_name | default: site.title }}{% endif %}</title>
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    <script src="{{ '/site.js' | relative_url }}" defer></script>
  </head>
  <body class="{{ page.body_class }}">
    <a class="skip-link" href="#main-content">{% if page.lang == 'en' %}Skip to content{% else %}本文へ移動{% endif %}</a>
    {% include header.html %}
    <main id="main-content" tabindex="-1">
      {{ content }}
    </main>
    {% unless page.layout == "home" %}
      {% include footer.html %}
    {% endunless %}
  </body>
</html>
