---
layout: default
home_footer: true
---
<section class="home-layout network-home" {% if page.profile_id %}id="{{ page.profile_id }}"{% endif %} aria-labelledby="home-title">
  {% include network-background.html %}
  <div class="home-profile">
    <h1 id="home-title">{{ page.hero_name }}</h1>
    <p class="name-sub">{{ page.hero_sub }}</p>
    <p class="lead">{{ page.lead }}</p>
  </div>

  <aside class="profile-panel" aria-label="{{ page.panel_aria }}">
    <dl>
      <div>
        <dt>{{ page.affiliation_label }}</dt>
        <dd>{{ page.affiliation }}</dd>
      </div>
      <div>
        <dt>GitHub</dt>
        <dd>
          <a class="github-link" href="https://github.com/K-Yamada-2002" target="_blank" rel="noopener noreferrer">
            <img src="https://github.githubassets.com/favicons/favicon.svg" alt="" width="18" height="18">
            <span>K-Yamada-2002</span>
          </a>
        </dd>
      </div>
    </dl>
  </aside>
</section>

<div class="home-bottom">
  <p>&copy; 2026 {{ page.copyright_name }}</p>
</div>
