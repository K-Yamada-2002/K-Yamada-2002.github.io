---
layout: default
---
<article class="page">
  <p class="eyebrow">{{ page.eyebrow }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.date %}
    <p class="article-date">
      {% if page.lang == 'en' %}
        {{ page.date | date: "%B %-d, %Y" }}
      {% else %}
        {{ page.date | date: "%Y年%-m月%-d日" }}
      {% endif %}
    </p>
  {% endif %}
  <div class="article-body">
    {{ content }}
  </div>
</article>
